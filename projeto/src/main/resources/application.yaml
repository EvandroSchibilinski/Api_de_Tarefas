spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/projeto
    username: postgres
    password: Admin
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

security:
  jwt:
    secret: ${JWT_SECRET}
    expiracao: 2h
